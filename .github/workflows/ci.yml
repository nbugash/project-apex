name: CI

# Manual only. Every push with an open pull request previously fired both `push` and
# `pull_request`, running all four jobs twice for identical results — and smoke-macos runs
# on a macOS runner, which private repositories are billed for at ten times the rate of a
# Linux one. Roughly thirty-two billed minutes per run, doubled, for no extra information.
#
# The cost of this choice is that nothing gates a merge automatically. The checks are the
# ones in each feature's quickstart; run them locally, and dispatch this when you want the
# same suite on a clean machine:
#
#   gh workflow run ci.yml --ref <branch>
on: workflow_dispatch

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run ds:sync
      # Required checks, not advisory. lint:ds enforces Constitution Principle I
      # mechanically; perf:budget is what makes Principle V a measurement, not a claim.
      - run: npm run lint:ds
      - run: npm run test:unit
      - run: npm run perf:budget

  e2e:
    # Linux only. macOS has no WebDriver for its platform webview — see Appendix A, A-E2E.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y
          webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev
          imagemagick x11-utils
      # imagemagick supplies import, convert, identify and compare; x11-utils supplies
      # xwininfo. The screenshot capture, the blank-window assertion and the fidelity
      # gate all shell out to them. They were missing for this job's entire history:
      # every capture failed, the hook warned and carried on, and the suite reported
      # success having photographed nothing 65 times.
      - run: |
          for tool in import convert identify compare xwininfo; do
            command -v "$tool" >/dev/null || { echo "missing required tool: $tool"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # tauri-driver bridges WebDriver to the platform webview; the suite cannot start
      # without it, and its absence otherwise surfaces as an opaque connection refusal.
      - run: cargo install tauri-driver --locked
      - run: npm ci && npm run ds:sync
      # The harness builds the bundle and the binary itself and serves the bundle on the
      # dev port, because a debug build loads devUrl and would otherwise show a blank
      # webview with every selector timing out for no visible reason.
      - run: xvfb-run -a npm run e2e
      # The fidelity gate needs a rendered window, so it runs where the e2e suite runs.
      # The gate's own tests first: a gate that cannot fail would let the run below pass
      # while measuring nothing. Under xvfb so the end-to-end case is not skipped.
      - run: xvfb-run -a npm run gate:fidelity:test
      - run: xvfb-run -a npm run gate:fidelity
      # Screenshots and any difference image are the evidence for a failed visual run.
      # Without them a reviewer has to reproduce the failure locally to see anything.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: |
            reports/screenshots/
            tools/gate-fidelity/out/
          retention-days: 14

  smoke-macos:
    # Not an end-to-end run: no WebDriver exists for WKWebView. This proves the app starts
    # and paints on the platform the suite cannot drive (Appendix A, A-E2E).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci && npm run build
      - run: npm run smoke:macos
