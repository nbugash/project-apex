[package]
name = "apex-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "ide-engine"
path = "src/main.rs"

[dependencies]
apex-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
