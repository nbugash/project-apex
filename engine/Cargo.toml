[package]
name = "apex-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "apex_engine"
path = "src/lib.rs"

[[bin]]
name = "ide-engine"
path = "src/main.rs"

[dependencies]
apex-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# workspace/stat returns the file's hash (§4.8); it is the sole input to cache validity.
# Deliberately the only addition: the engine stays synchronous and runtime-free, because it is
# embedded in the client and transferred on every first connect.
sha2 = "0.10"
# Linux only, and named in exactly one file: adapters/outbound/inotify_watcher.rs.
# `engine/tests/inotify_confinement.rs` fails the build if it appears anywhere else,
# because everything that decides anything -- which paths are watched, when events
# collapse, when a flood becomes an invalidation -- is tested without a filesystem.
# Still no async runtime: the watcher is one std thread polling a descriptor.
[target.'cfg(target_os = "linux")'.dependencies]
# `default-features = false` drops inotify's `stream` feature, which pulls in futures-util and
# tokio. The comment above says this engine is runtime-free and it was not: F004 added inotify
# with its defaults and tokio arrived transitively. A runtime nothing calls is dead weight in a
# binary the client ships on every first connect, which is the reason the claim exists.
inotify = { version = "0.11", default-features = false }
# The pseudo-terminal, the process group and the per-process resource limits (F010).
# Named in exactly one file: adapters/outbound/pty_runner.rs, on the same terms as inotify
# above -- `engine/tests/pty_confinement.rs` fails the build if it appears anywhere else.
# Everything that decides anything -- how output is chunked, when a producer is slowed, what
# the retention bound admits, when an escalation is due -- is tested without a process.
#
# Four features and no default. `term` is the pty itself, `process` the fork/exec and the
# process group, `resource` the rlimits A-TASKLIMIT bounds a task with, `signal` the stop
# path. The default feature set pulls in mount, mqueue and much else this has no use for.
#
# Still no async runtime: a task is one std thread reading a descriptor, as the watcher is.
nix = { version = "0.31", default-features = false, features = [
  "term",
  "process",
  "resource",
  "signal",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
